services:
  api:
    build: .
    env_file:
      - .env
    environment:
      APP_ENV: production
      HOST: 0.0.0.0
      PORT: 8000
      OLLAMA_BASE_URL: http://ollama:11434
      CATALOG_PATH: app/services/default.json
      PRODUCT_VOCABULARY_PATH: app/services/product_vocabulary.json
    ports:
      - "8000:8000"
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  ollama:
    image: ollama/ollama:0.12.3
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  ollama-data:
